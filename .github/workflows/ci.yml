name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Node 24: Vitest 5 and jsdom 30 need >= 22.12 / 22.22.2, and it matches local dev.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # next-env.d.ts and .next/types (e.g. the global LayoutProps) are gitignored and normally
      # generated by `next dev`/`next build`; typegen creates them without needing Supabase env.
      - name: Type-check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Test
        run: npm test

      # `npm run build` is deliberately not run here: generateStaticParams queries the live
      # Supabase project at build time, and Vercel already builds on every deploy.
